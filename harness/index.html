<!doctype html><html><head><meta charset="utf-8"><title>Note Aging harness</title>
<link rel="stylesheet" href="app.css"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#main{flex:1;display:flex;min-height:0}
#explorer{width:270px;background:var(--background-secondary);border-right:1px solid var(--background-modifier-border);overflow:auto;padding:8px 6px}
#editor{flex:1;padding:36px 56px;background:var(--background-primary);color:var(--text-normal)}
#editor p{color:var(--text-muted);line-height:1.7}
#right{width:330px;background:var(--background-secondary);border-left:1px solid var(--background-modifier-border);overflow:auto}
#right .workspace-leaf-content{height:100%;display:flex;flex-direction:column}
#right .view-header{padding:10px 14px;font-weight:600;color:var(--text-muted);font-size:13px;border-bottom:1px solid var(--background-modifier-border)}
#right .view-content{flex:1;overflow:auto}
#statusbar{display:flex;justify-content:flex-end;gap:12px;padding:3px 12px;font-size:12px;color:var(--text-muted);background:var(--background-secondary);border-top:1px solid var(--background-modifier-border)}
.vertical-tab-content{padding:20px 28px}
.nav-folder-children{padding-left:14px}
.notice-container{position:fixed;top:12px;right:12px;z-index:100;display:flex;flex-direction:column;gap:6px}
.notice{background:#333;color:#fff;padding:10px 14px;border-radius:8px;font-size:13px}
</style></head>
<body class="theme-dark mod-macos">
<div id="main">
<div id="explorer" class="nav-files-container-wrap"><div class="nav-files-container"></div></div>
<div id="editor"><h1 id="editor-title"></h1><p>Notes on focus and long stretches of uninterrupted work. Chapter summaries, a few quotes and the rules I tried in the first month.</p><p>Rule 1: schedule every minute of the workday. Rule 2: embrace boredom.</p></div>
<div id="right"></div>
</div>
<div id="statusbar"><div class="status-bar-item">312 words</div></div>
<script src="dist.js"></script></body></html>
